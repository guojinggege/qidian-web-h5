<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 奇点社区</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at top, rgba(127,119,221,0.18), transparent 60%),
      radial-gradient(ellipse at 80% 30%, rgba(159,127,229,0.10), transparent 60%),
      var(--bg-base);
    padding: 20px;
  }
  .auth-card {
    width: 400px;
    max-width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border-2);
    border-radius: var(--r-xl);
    padding: 36px 32px 28px;
    box-shadow: var(--shadow-lg);
  }
  .auth-logo {
    display: flex; align-items: center; gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .auth-logo-mark {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--brand-300), var(--brand-600));
    border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    color: white; font-weight: 500; font-size: 17px;
  }
  .auth-logo span.brand { font-size: 16px; font-weight: 500; }
  .auth-title { font-size: 22px; font-weight: 500; margin: 0 0 18px; text-align: center; }
  .auth-form { display: flex; flex-direction: column; gap: 14px; }
  .auth-form .field-label { font-size: 12px; color: var(--text-3); margin-bottom: 4px; display: block; }
  .auth-error {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid rgba(229,90,75,0.30);
    padding: 8px 12px;
    border-radius: var(--r-md);
    font-size: 12px;
    display: none;
  }
  .auth-error.show { display: block; }
  .auth-foot {
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    margin-top: 18px;
  }
  .auth-foot a { color: var(--brand-300); }
  .auth-foot a:hover { color: var(--brand-200); text-decoration: underline; }
  .auth-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 14px; color: var(--text-4); font-size: 11px; }
  .auth-divider::before, .auth-divider::after { content:''; flex: 1; height: 1px; background: var(--border-1); }
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">
    <span class="auth-logo-mark">奇</span>
    <span class="brand">奇点社区</span>
  </div>

  <h1 class="auth-title">登录</h1>

  <div class="auth-error" id="errBox"></div>

  <form class="auth-form" id="loginForm">
    <div>
      <label class="field-label" for="email">邮箱</label>
      <input class="input" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div>
      <label class="field-label" for="password">密码</label>
      <input class="input" type="password" id="password" name="password" required minlength="6" autocomplete="current-password" placeholder="≥ 6 位">
    </div>
    <button class="btn btn-primary lg block" type="submit" id="submitBtn">
      <i class="ti ti-login"></i> 登录
    </button>
  </form>

  <div class="auth-foot">
    没有账号? <a href="register.html" id="registerLink" onclick="location.href=this.getAttribute('href');return false;">立即注册</a>
  </div>

  <div class="auth-divider">或</div>

  <div class="auth-foot" style="margin-top:0">
    <a href="creator-login.html" id="creatorLink" onclick="location.href=this.getAttribute('href');return false;">
      <i class="ti ti-crown" style="color:#FFD700;font-size:12px"></i> 我是创作者 →
    </a>
  </div>
</div>

<script src="../shared/auth.js?v=13"></script>
<script>
  const params = new URLSearchParams(location.search);
  const nextUrl = params.get('next') || 'home.html';
  // 保留 next 给 register / creator-login
  if (params.get('next')) {
    document.getElementById('registerLink').href = 'register.html?next=' + encodeURIComponent(nextUrl);
    document.getElementById('creatorLink').href = 'creator-login.html?next=' + encodeURIComponent(nextUrl);
  }

  // 已登录: 在 errBox 位置友好提示,但不自动跳转 (允许用户切换账号)
  const _existed = QDAuth.getCurrentUser();
  if (_existed) {
    const e = document.getElementById('errBox');
    e.style.background = 'var(--info-bg)';
    e.style.color = 'var(--info)';
    e.style.borderColor = 'rgba(74,159,229,0.25)';
    e.innerHTML = `你已登录为 <b>${_existed.username}</b> · <a href="${nextUrl}" onclick="location.href='${nextUrl}';return false;" style="color:inherit;text-decoration:underline">回到首页</a> · 或重新登录其他账号`;
    e.classList.add('show');
  }

  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('errBox');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }
  function clearError() {
    errBox.classList.remove('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    submitBtn.disabled = true;
    try {
      const email = form.elements.email.value.trim();
      const password = form.elements.password.value;
      await QDAuth.login({ email, password });
      location.href = nextUrl;
    } catch (err) {
      showError(err.message || '登录失败');
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
