<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短剧频道 · 奇点社区</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .dc-shell { max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }
  .dc-banner {
    height: 220px;
    margin: 16px 0 24px;
    border-radius: var(--r-xl);
    background:
      linear-gradient(90deg, rgba(14,14,18,0.92) 0%, rgba(14,14,18,0.30) 60%, transparent),
      linear-gradient(135deg, var(--c-amber), var(--c-coral));
    padding: 32px 40px;
    display: flex; flex-direction: column; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .dc-banner h1 { font-size: 36px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.5px; }
  .dc-banner p { color: var(--text-2); font-size: 14px; max-width: 460px; line-height: 1.6; margin: 0; }
  .dc-banner .btn-row { margin-top: 16px; display: flex; gap: 8px; }
  .dc-banner::after {
    content: ''; position: absolute;
    top: 0; right: 0; bottom: 0; width: 50%;
    background:
      radial-gradient(circle at 80% 50%, rgba(229,90,75,0.40), transparent 60%);
    pointer-events: none;
  }

  .dc-filters {
    display: flex; gap: 10px; align-items: center;
    margin-bottom: 24px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border-1);
  }

  .dc-section { margin-bottom: 32px; }
  .dc-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .dc-section-head h2 { font-size: 18px; font-weight: 500; margin: 0; }

  .dc-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }

  .dc-rank {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    padding: 20px;
  }
  .dc-rank-col h3 { font-size: 13px; font-weight: 500; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  .rank-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-1); }
  .rank-item:last-child { border-bottom: none; }
  .rank-num { font-size: 18px; font-weight: 500; font-family: ui-monospace, monospace; color: var(--text-4); width: 22px; }
  .rank-num.top { color: var(--c-coral); }
</style>
</head>
<body data-channel="drama">
<div class="app-shell">
  <header class="app-header"><div id="header"></div></header>
  <aside class="app-sidebar"><nav class="sidebar" id="sidebar"></nav></aside>

  <main class="app-main">
    <div class="dc-shell">
      <section class="dc-banner">
        <span class="ch-pill amber" style="width:fit-content;margin-bottom:10px"><i class="ti ti-device-tv ico"></i>短剧</span>
        <h1>600+ 部海外华人爽剧</h1>
        <p>霸总、复仇、穿越、虐恋、玄学重生 — 通勤地铁上的下饭神器，黑卡会员全部解锁</p>
        <div class="btn-row">
          <button class="btn btn-primary lg"><i class="ti ti-player-play"></i>立即开追</button>
          <button class="btn lg"><i class="ti ti-crown" style="color:#FFD700"></i>VIP 全部解锁</button>
        </div>
      </section>

      <div class="dc-filters">
        <span class="t-sm c-3">分类:</span>
        <div class="seg" id="subFilter"></div>
        <span style="margin-left:auto" class="t-sm c-3">排序:</span>
        <div class="seg">
          <div class="seg-item active">最热</div>
          <div class="seg-item">最新</div>
          <div class="seg-item">高分</div>
        </div>
      </div>

      <section class="dc-section">
        <div class="dc-section-head">
          <h2><i class="ti ti-flame c-danger"></i> 正在大爆 · 6 部</h2>
          <span class="text-link t-sm">查看全部 →</span>
        </div>
        <div class="dc-grid" id="dramaGrid"></div>
      </section>

      <section class="dc-section">
        <div class="dc-section-head"><h2><i class="ti ti-trending-up c-brand"></i> 三榜单</h2></div>
        <div class="dc-rank">
          <div class="dc-rank-col">
            <h3><i class="ti ti-flame" style="color:var(--c-coral)"></i> 周热播榜</h3>
            <div id="rank1"></div>
          </div>
          <div class="dc-rank-col">
            <h3><i class="ti ti-star" style="color:#FFD700"></i> 用户高分榜</h3>
            <div id="rank2"></div>
          </div>
          <div class="dc-rank-col">
            <h3><i class="ti ti-sparkles" style="color:var(--brand-300)"></i> 新晋潜力榜</h3>
            <div id="rank3"></div>
          </div>
        </div>
      </section>

      <section class="dc-section">
        <div class="dc-section-head"><h2>全部短剧</h2></div>
        <div class="dc-grid" id="allGrid"></div>
      </section>
    </div>
  </main>

  <aside class="app-rightbar" style="display:none"></aside>
</div>

<script src="../shared/data.js?v=15"></script>
<script src="../shared/components.js?v=15"></script>
<script>
(async () => {
  await QD.ready();

  QDC.renderHeader(QDC.$('#header'));
  QDC.renderSidebar(QDC.$('#sidebar'));
  document.querySelector('.app-shell').style.gridTemplateColumns = 'var(--sidebar-w) 1fr';
  document.querySelector('.app-shell').style.gridTemplateAreas = '"header header" "sidebar main"';

  function dramaCard(d) {
    return `
      <a class="drama-card" href="drama-watch.html?vid=${d.id}&type=drama">
        <div class="drama-cover" style="background-image:${d.cover}">
          <div class="vip-lock"><i class="ti ti-crown"></i>VIP</div>
          <div class="episodes">${d.episodes}集 全</div>
        </div>
        <div class="drama-info">
          <div class="drama-title line-clamp-2">${d.title}</div>
          <div class="drama-meta row gap-2"><span><i class="ti ti-eye"></i> ${d.plays}</span><span class="dot-sep"></span><span><i class="ti ti-star" style="color:#FFD700"></i> ${d.rating}</span></div>
        </div>
      </a>
    `;
  }

  // 子频道筛选：用 QD.subChannels 中 parentId === 'drama' 的子频道
  const dramaSubs = QD.subChannelsOf('drama');
  const initialSub = new URLSearchParams(location.search).get('sub') || '';
  let activeSub = dramaSubs.some(s => s.id === initialSub) ? initialSub : '';

  // 渲染子频道 tab
  function renderSubFilter() {
    document.getElementById('subFilter').innerHTML = `
      <div class="seg-item ${!activeSub ? 'active' : ''}" data-sub="">全部</div>
      ${dramaSubs.map(s => {
        const cnt = QD.dramas.filter(d => d.subChannelId === s.id).length;
        return `<div class="seg-item ${activeSub === s.id ? 'active' : ''}" data-sub="${s.id}">${s.name}${cnt ? ' · ' + cnt : ''}</div>`;
      }).join('')}
    `;
    document.querySelectorAll('#subFilter .seg-item').forEach(t => {
      t.addEventListener('click', () => {
        activeSub = t.dataset.sub;
        renderSubFilter();
        renderGrids();
        // 同步 URL
        const u = new URL(location.href);
        if (activeSub) u.searchParams.set('sub', activeSub);
        else u.searchParams.delete('sub');
        history.replaceState(null, '', u.toString());
      });
    });
  }

  function filterDramas() {
    return activeSub ? QD.dramas.filter(d => d.subChannelId === activeSub) : QD.dramas;
  }
  function renderGrids() {
    const list = filterDramas();
    const dg = document.getElementById('dramaGrid');
    const ag = document.getElementById('allGrid');
    if (!list.length) {
      const subName = dramaSubs.find(s => s.id === activeSub)?.name || '该分类';
      dg.innerHTML = `<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--text-3)"><i class="ti ti-mood-empty" style="font-size:36px;display:block;margin-bottom:8px"></i>${subName} 暂无视频</div>`;
      ag.innerHTML = '';
      return;
    }
    dg.innerHTML = list.map(dramaCard).join('');
    ag.innerHTML = [...list, ...list].map(dramaCard).join('');
  }

  renderSubFilter();
  renderGrids();

  function rankItem(d, i) {
    return `
      <div class="rank-item">
        <span class="rank-num ${i < 3 ? 'top' : ''}">${i+1}</span>
        <div style="width:36px;height:48px;border-radius:4px;background-image:${d.cover};background-size:cover;flex-shrink:0"></div>
        <div class="grow" style="min-width:0">
          <div class="t-sm f-medium line-clamp-2">${d.title}</div>
          <div class="t-xs c-3" style="margin-top:2px">${d.plays} · ★${d.rating}</div>
        </div>
      </div>
    `;
  }
  document.getElementById('rank1').innerHTML = QD.dramas.slice(0, 5).map(rankItem).join('');
  document.getElementById('rank2').innerHTML = [...QD.dramas].sort((a,b)=>b.rating-a.rating).slice(0, 5).map(rankItem).join('');
  document.getElementById('rank3').innerHTML = QD.dramas.slice().reverse().slice(0, 5).map(rankItem).join('');
})();
</script>
</body>
</html>
