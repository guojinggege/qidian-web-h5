<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索 · Wavi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .sr-shell { max-width: 1080px; margin: 0 auto; padding: 28px 28px 60px; display: grid; grid-template-columns: 1fr 280px; gap: 24px; }
  .sr-main { min-width: 0; }
  .sr-search {
    display: flex; gap: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-2);
    border-radius: var(--r-pill);
    padding: 6px 6px 6px 20px;
    margin-bottom: 24px;
  }
  .sr-search input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-1); font-size: 14px; }
  .sr-meta { margin-bottom: 14px; color: var(--text-3); font-size: 12px; }

  .filter-bar {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-1);
    margin-bottom: 16px;
  }

  .sr-user {
    display: flex; gap: 14px;
    padding: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    margin-bottom: 10px;
  }
  .sr-user-body { flex: 1; min-width: 0; }
  .hl { background: rgba(127,119,221,0.28); color: var(--brand-200); padding: 0 2px; border-radius: 3px; }

  .sr-side .card { margin-bottom: 14px; }
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-header"><div id="header"></div></header>
  <aside class="app-sidebar"><nav class="sidebar" id="sidebar"></nav></aside>

  <main class="app-main">
    <div class="sr-shell">
      <div class="sr-main">
        <div class="sr-search">
          <i class="ti ti-search c-3" style="align-self:center;font-size:18px"></i>
          <input value="约基奇 不看人传球" />
          <button class="btn btn-primary">搜索</button>
        </div>

        <div class="sr-meta">为你找到 <span class="c-1 f-medium">142</span> 条相关结果 · 0.18 秒</div>

        <div class="tabs">
          <div class="tab active">综合</div>
          <div class="tab">帖子 · 88</div>
          <div class="tab">用户 · 24</div>
          <div class="tab">圈子 · 12</div>
          <div class="tab">短剧 · 18</div>
        </div>

        <div class="filter-bar">
          <span class="t-sm c-3">筛选:</span>
          <div class="seg">
            <div class="seg-item active">全部时间</div>
            <div class="seg-item">本周</div>
            <div class="seg-item">本月</div>
            <div class="seg-item">本年</div>
          </div>
          <div class="seg">
            <div class="seg-item active">综合排序</div>
            <div class="seg-item">最新</div>
            <div class="seg-item">最热</div>
          </div>
        </div>

        <div class="t-sm c-3" style="margin-bottom:10px"><i class="ti ti-users"></i> 相关用户</div>
        <div class="sr-user">
          <div class="avatar lg bg-grad-1 has-bg vip-ring">硅</div>
          <div class="sr-user-body">
            <div class="row gap-2">
              <span class="f-medium">硅谷<span class="hl">郊狼</span></span>
              <span class="badge">Lv.31</span>
              <span class="badge gold">VIP</span>
            </div>
            <div class="t-sm c-3" style="margin: 2px 0 6px">深度<span class="hl">NBA</span>观察者 · 写过多篇<span class="hl">约基奇</span>战术解析</div>
            <div class="t-xs c-4">12.8k 粉丝 · 4.2k 帖子</div>
          </div>
          <button class="btn sm btn-primary">关注</button>
        </div>
        <div class="sr-user">
          <div class="avatar lg bg-grad-3 has-bg">多</div>
          <div class="sr-user-body">
            <div class="row gap-2"><span class="f-medium">多伦多<span class="hl">球迷</span></span><span class="badge">Lv.14</span></div>
            <div class="t-sm c-3" style="margin: 2px 0 6px">东西部都关注，最近关注掘金</div>
            <div class="t-xs c-4">2.1k 粉丝 · 388 帖子</div>
          </div>
          <button class="btn sm">关注</button>
        </div>

        <div class="t-sm c-3" style="margin: 24px 0 10px"><i class="ti ti-message"></i> 相关帖子</div>
        <div id="feed"></div>
      </div>

      <aside class="sr-side">
        <div class="card">
          <div class="t-md f-medium" style="margin-bottom:10px">搜索建议</div>
          <div class="row" id="suggestList" style="flex-wrap:wrap;gap:6px"></div>
        </div>
        <div class="card">
          <div class="t-md f-medium" style="margin-bottom:10px"><i class="ti ti-flame c-danger"></i> 热门搜索</div>
          <div id="hotList"></div>
        </div>
      </aside>
    </div>
  </main>

  <aside class="app-rightbar" style="display:none"></aside>
</div>

<script src="../shared/data.js?v=17"></script>
<script src="../shared/components.js?v=17"></script>
<script>
(async () => {
  await QD.ready();

  QDC.renderHeader(QDC.$('#header'));
  QDC.renderSidebar(QDC.$('#sidebar'));
  document.querySelector('.app-shell').style.gridTemplateColumns = 'var(--sidebar-w) 1fr';
  document.querySelector('.app-shell').style.gridTemplateAreas = '"header header" "sidebar main"';

  document.getElementById('suggestList').innerHTML = QD.searchSuggestions.map(s => `<span class="badge t-xs" style="cursor:pointer">${s}</span>`).join('');

  document.getElementById('hotList').innerHTML = QD.hotSearches.map((h, i) => `
    <div class="row gap-2" style="padding:8px 0; border-bottom:1px solid var(--border-1)">
      <span class="${i < 3 ? 'c-brand' : 'c-3'} t-sm f-medium" style="width:18px">${i+1}</span>
      <span class="grow ellipsis t-sm">${h.q}</span>
      <span class="t-xs c-4">${h.delta}</span>
    </div>
  `).join('');

  // 读 URL 的 ?q= 关键词，搜索匹配的帖子并高亮
  const q = (new URLSearchParams(location.search).get('q') || '约基奇').trim();
  document.querySelector('.sr-search input').value = q;
  document.querySelector('.sr-meta').innerHTML =
    `为你找到 <span class="c-1 f-medium">${q ? '若干' : '0'}</span> 条相关结果 · 关键词「${QDC.escape(q)}」`;

  const samples = q
    ? QD.posts.filter(p => p.title.includes(q) || (p.excerpt || '').includes(q))
    : [];
  const list = samples.length ? samples : QD.posts.slice(0, 3);
  document.getElementById('feed').innerHTML = list.map(p => {
    let html = QDC.tplPostCard(p);
    if (q) {
      // 简易高亮（仅针对显示文本，避免命中属性值）
      const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(safeQ, 'g');
      html = html.replace(re, `<span class="hl">${q}</span>`);
    }
    return html;
  }).join('');
})();
</script>
</body>
</html>
