<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放 · Wavi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .dw-shell { display: grid; grid-template-columns: 1fr 360px; gap: 16px; max-width: 1400px; margin: 0 auto; padding: 16px 20px 60px; }
  .dw-main { min-width: 0; }
  .dw-player-frame {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: var(--r-lg);
    overflow: hidden;
    position: relative;
  }
  .dw-player-frame video,
  .dw-player-frame iframe {
    width: 100%;
    height: 100%;
    max-height: 80vh;
    border: none;
    display: block;
  }
  .dw-info { padding: 22px 0; border-bottom: 1px solid var(--border-1); }
  .dw-info h1 { font-size: 24px; font-weight: 500; margin: 0 0 6px; }
  .dw-meta { display: flex; gap: 14px; font-size: 12px; color: var(--text-3); margin-bottom: 14px; flex-wrap: wrap; }
  .dw-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .dw-description { padding: 18px 0; color: var(--text-2); font-size: 14px; line-height: 1.7; border-bottom: 1px solid var(--border-1); }

  .dw-recommend { margin-top: 24px; }
  .dw-recommend h3 { font-size: 16px; font-weight: 500; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .dw-rec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

  .dw-side {
    position: sticky; top: calc(var(--header-h) + 16px);
    height: calc(100vh - var(--header-h) - 32px);
  }
  .err-box {
    padding: 80px 20px; text-align: center;
    background: var(--bg-card); border: 1px dashed var(--border-2);
    border-radius: var(--r-lg);
  }
  .err-box i { font-size: 56px; color: var(--text-4); display: block; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-header"><div id="header"></div></header>
  <aside class="app-sidebar"><nav class="sidebar" id="sidebar"></nav></aside>

  <main class="app-main">
    <div class="dw-shell">
      <div class="dw-main" id="main"></div>

      <aside class="dw-side">
        <div class="live-room" style="height: 100%; background: var(--bg-card); border: 1px solid var(--border-1); border-radius: var(--r-lg);">
          <div class="live-room-head">
            <span class="live-dot">LIVE</span>
            <span class="t-md f-medium">追剧实时房</span>
            <span class="grow"></span>
            <span class="t-sm c-3" id="liveOnline">— 在线</span>
          </div>
          <div class="live-room-body" id="liveBody"></div>
          <div class="live-room-foot">
            <input class="live-input" placeholder="一起吐槽剧情...">
            <button class="icon-btn"><i class="ti ti-send"></i></button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <aside class="app-rightbar" style="display:none"></aside>
</div>

<script src="../shared/data.js?v=17"></script>
<script src="../shared/components.js?v=17"></script>
<script>
(async () => {
  await QD.ready();

  QDC.renderHeader(QDC.$('#header'));
  QDC.renderSidebar(QDC.$('#sidebar'));
  document.querySelector('.app-shell').style.gridTemplateColumns = 'var(--sidebar-w) 1fr';
  document.querySelector('.app-shell').style.gridTemplateAreas = '"header header" "sidebar main"';

  const params = new URLSearchParams(location.search);
  const vid = params.get('vid') || params.get('id');  // 兼容旧的 ?id=
  const type = params.get('type') || 'drama';

  const pool = type === 'film' ? (QD.films || []) : (QD.dramas || []);
  const video = vid ? pool.find(v => v.id === vid) : pool[0];

  // 视频不存在
  if (!video) {
    document.title = '视频不存在 · Wavi';
    document.getElementById('main').innerHTML = `
      <div class="err-box">
        <i class="ti ti-video-off"></i>
        <h2 style="margin:0 0 8px; font-weight:500">视频不存在</h2>
        <p class="c-3" style="margin:0 0 24px">${vid ? '没找到 ID 为 <code>'+vid+'</code> 的视频。' : '缺少 vid 参数。'}</p>
        <a class="btn btn-primary" href="drama-channel.html"><i class="ti ti-arrow-left"></i> 返回短剧频道</a>
      </div>
    `;
    document.querySelector('.dw-side').style.display = 'none';
    document.querySelector('.dw-shell').style.gridTemplateColumns = '1fr';
    return;
  }

  document.title = `${video.title} · Wavi`;

  /* ---------- 播放器渲染 ---------- */
  function renderPlayer(v) {
    const embed = v.embedType || 'mp4';
    if (embed === 'mp4') {
      return `<video src="${v.playUrl}" controls autoplay playsinline style="width:100%;max-height:80vh" poster=""></video>`;
    }
    if (embed === 'youtube') {
      // playUrl 可能是 https://www.youtube.com/watch?v=XXX 或者纯 ID
      const m = (v.playUrl || '').match(/(?:v=|youtu\.be\/|embed\/)([^&?/]+)/);
      const id = m ? m[1] : v.playUrl;
      return `<iframe src="https://www.youtube.com/embed/${id}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }
    if (embed === 'bilibili') {
      // playUrl 可能是 BVxxx 或 bilibili.com/video/BVxxx
      const m = (v.playUrl || '').match(/BV[A-Za-z0-9]+/);
      const bvid = m ? m[0] : v.playUrl;
      return `<iframe src="//player.bilibili.com/player.html?bvid=${bvid}&high_quality=1" allowfullscreen scrolling="no"></iframe>`;
    }
    return `<div class="err-box"><i class="ti ti-alert-triangle"></i>不支持的视频源类型: ${embed}</div>`;
  }

  /* ---------- 推荐：同类型其他视频 ---------- */
  function renderRec(currentId) {
    const others = pool.filter(v => v.id !== currentId).slice(0, 8);
    if (!others.length) return '';
    const typeBadge = type === 'film' ? '影视' : '短剧';
    return `
      <div class="dw-recommend">
        <h3><i class="ti ti-thumb-up c-brand"></i> 同${typeBadge}推荐</h3>
        <div class="dw-rec-grid">
          ${others.map(v => `
            <a class="drama-card" href="drama-watch.html?vid=${v.id}&type=${type}">
              <div class="drama-cover" style="background-image:${v.cover};aspect-ratio:16/9">
                ${v.episodes ? `<div class="episodes">${v.episodes}集</div>` : ''}
              </div>
              <div class="drama-info">
                <div class="drama-title line-clamp-2">${v.title}</div>
                <div class="drama-meta row gap-2">
                  <span><i class="ti ti-eye"></i> ${v.playsText || QD.fmtNum(v.plays || 0)}</span>
                  <span class="dot-sep"></span>
                  <span><i class="ti ti-star" style="color:#FFD700"></i> ${v.rating}</span>
                </div>
              </div>
            </a>
          `).join('')}
        </div>
      </div>
    `;
  }

  const tagBadges = (video.tags || []).map(t => `<span class="badge">#${t}</span>`).join(' ');
  const channelLabel = type === 'film' ? '影视' : '短剧';
  const channelColor = type === 'film' ? 'blue' : 'amber';
  const channelIcon  = type === 'film' ? 'ti-movie' : 'ti-device-tv';

  document.getElementById('main').innerHTML = `
    <div class="row gap-2 t-sm c-3" style="margin-bottom:10px">
      <a href="${type === 'film' ? QDC.channelPageUrl('movie') : 'drama-channel.html'}" class="text-link">
        <i class="ti ti-arrow-left"></i> 返回${channelLabel}
      </a>
      <span class="dot-sep"></span>
      <span class="ch-pill ${channelColor}"><i class="ti ${channelIcon} ico"></i>${channelLabel}</span>
    </div>

    <div class="dw-player-frame">${renderPlayer(video)}</div>

    <div class="dw-info">
      <h1>${video.title}</h1>
      <div class="dw-meta">
        <span><i class="ti ti-eye"></i> ${video.playsText || QD.fmtNum(video.plays || 0)} 播放</span>
        <span><i class="ti ti-star" style="color:#FFD700"></i> ${video.rating} 分</span>
        ${video.episodes ? `<span><i class="ti ti-clock"></i> ${video.episodes} 集</span>` : ''}
        <span>${tagBadges}</span>
      </div>
      <div class="dw-actions">
        <button class="btn"><i class="ti ti-thumb-up"></i> 点赞</button>
        <button class="btn"><i class="ti ti-share-3"></i> 分享</button>
        <button class="btn"><i class="ti ti-bookmark"></i> 收藏</button>
        <button class="btn"><i class="ti ti-flag"></i> 举报</button>
        <button class="btn btn-primary" style="margin-left:auto">
          <i class="ti ti-bell"></i> ${type === 'film' ? '想看' : '追剧'}
        </button>
      </div>
    </div>

    <div class="dw-description">${QDC.escape(video.description || '').replace(/\n/g, '<br>')}</div>

    ${renderRec(video.id)}
  `;

  // 实时房在线人数：drama 可以借用关联 post 的 liveOnline；这里简化为固定值
  document.getElementById('liveOnline').innerHTML = `<i class="ti ti-users"></i> ${(video.episodes || 12) * 3} 在线`;

  // 实时房沿用 p008 / p013 等短剧相关帖子
  const livePostId = type === 'drama' ? 'p008' : 'p001';
  QDC.startLiveRoom(document.querySelector('.live-room'), livePostId);
})();
</script>
</body>
</html>
