<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帖子详情 · 奇点社区</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .pd-shell {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 24px 40px;
  }
  .pd-main { min-width: 0; }
  .pd-side { position: sticky; top: calc(var(--header-h) + 20px); height: calc(100vh - var(--header-h) - 40px); }
  .pd-post {
    background: var(--bg-card);
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    padding: 24px 28px;
    margin-bottom: 16px;
  }
  .pd-title { font-size: 26px; font-weight: 500; line-height: 1.35; margin: 12px 0 16px; }
  .pd-content { font-size: 15px; line-height: 1.8; color: var(--text-2); }
  .pd-content p { margin: 0 0 14px; }
  .pd-video {
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: var(--r-md);
    overflow: hidden;
    background: #000;
    margin: 16px 0;
  }
  .pd-video iframe, .pd-video video {
    width: 100%; height: 100%; border: 0; display: block;
  }
  .pd-images {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  .pd-images img {
    width: 100%;
    aspect-ratio: 16/10;
    object-fit: cover;
    border-radius: var(--r-md);
    background: var(--bg-elev);
    display: block;
  }
  .pd-images img:only-child {
    aspect-ratio: auto;
    max-height: 540px;
  }
  /* gallery 类型: 图片完整展示 + 全宽堆叠 */
  .pd-gallery {
    display: flex; flex-direction: column; gap: 12px;
    margin-top: 14px;
  }
  .pd-gallery img {
    width: 100%;
    max-height: 720px;
    object-fit: contain;
    border-radius: var(--r-md);
    background: var(--bg-elev);
    display: block;
  }
  /* question 类型: 卡片轻微黄色背景 + 标题前 ❓ + "问题详情" 小标题 */
  .pd-post.is-question {
    background: rgba(245,158,11,0.06);
    border-color: rgba(245,158,11,0.25);
  }
  .pd-question-head {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: #FFD700;
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.30);
    padding: 4px 10px;
    border-radius: var(--r-pill);
    margin-top: 12px;
  }
  .pd-empty-answers {
    padding: 28px 16px;
    border: 1px dashed rgba(245,158,11,0.35);
    border-radius: var(--r-md);
    text-align: center;
    color: #FFD700;
    background: rgba(245,158,11,0.04);
    margin-top: 14px;
  }
  .pd-actions {
    display: flex; gap: 8px; align-items: center;
    padding: 14px 0; border-top: 1px solid var(--border-1); margin-top: 18px;
  }
  .pd-act {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: var(--bg-elev);
    border-radius: var(--r-pill);
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
  }
  .pd-act:hover { background: var(--bg-hover); color: var(--text-1); }
  .pd-act.active { background: var(--brand-bg); color: var(--brand-300); }
  .comment-input {
    display: flex; gap: 10px;
    padding: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    margin-bottom: 16px;
  }
  .comment-input textarea {
    flex: 1; min-height: 60px;
    background: transparent; border: none; outline: none;
    color: var(--text-1); font-size: 13px; line-height: 1.6;
    resize: vertical;
  }
  .pd-side .live-room { height: 100%; background: var(--bg-card); border: 1px solid var(--border-1); border-radius: var(--r-lg); }
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-header"><div id="header"></div></header>
  <aside class="app-sidebar"><nav class="sidebar" id="sidebar"></nav></aside>

  <main class="app-main">
    <div class="pd-shell">
      <div class="pd-main" id="postMain"></div>
      <aside class="pd-side">
        <div class="live-room">
          <div class="live-room-head">
            <span class="live-dot">LIVE</span>
            <span class="t-md f-medium">实时讨论房</span>
            <span class="grow"></span>
            <span class="t-sm c-3"><i class="ti ti-users"></i> 142 在线</span>
          </div>
          <div class="live-room-body" id="liveBody"></div>
          <div class="live-room-foot">
            <input class="live-input" placeholder="说点什么... ↵ 发送">
            <button class="icon-btn"><i class="ti ti-mood-smile"></i></button>
            <button class="icon-btn"><i class="ti ti-send"></i></button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <aside class="app-rightbar" style="display:none"></aside>
</div>

<script src="../shared/data.js?v=17"></script>
<script src="../shared/components.js?v=17"></script>
<script>
(async () => {
  await QD.ready();

  QDC.renderHeader(QDC.$('#header'));
  QDC.renderSidebar(QDC.$('#sidebar'));

  // Override grid: use 2-col for post-detail page
  document.querySelector('.app-shell').style.gridTemplateColumns = 'var(--sidebar-w) 1fr';
  document.querySelector('.app-shell').style.gridTemplateAreas = '"header header" "sidebar main"';

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const post = id ? QD.postById(id) : null;

  // 帖子不存在
  if (!post) {
    document.title = '帖子不存在 · 奇点社区';
    document.getElementById('postMain').innerHTML = `
      <div style="padding: 80px 20px; text-align: center; background: var(--bg-card); border: 1px dashed var(--border-2); border-radius: var(--r-lg)">
        <i class="ti ti-mood-sad" style="font-size: 56px; color: var(--text-4); display: block; margin-bottom: 14px"></i>
        <h2 style="margin: 0 0 8px; font-weight: 500">帖子不存在</h2>
        <p class="c-3" style="margin: 0 0 24px">${id ? 'ID <code>' + id + '</code> 找不到对应的帖子。' : '没有提供帖子 ID。'}</p>
        <a class="btn btn-primary" href="home.html"><i class="ti ti-arrow-left"></i> 返回首页</a>
      </div>
    `;
    // 隐藏右侧实时房
    document.querySelector('.pd-side').style.display = 'none';
    document.querySelector('.pd-shell').style.gridTemplateColumns = '1fr';
    return;
  }

  const ch = QD.channelById(post.channelId);
  // 用户帖子用 post.authorName/authorAvatar; 种子帖用 authorOf
  const author = post.isUserPost
    ? { id: post.authorId, name: post.authorName || '用户', avatar: post.authorAvatar || 'bg-grad-6', level: post.authorLevel || 1, vip: false }
    : QD.authorOf(post);
  const postComments = QD.comments.filter(c => c.postId === post.id);
  document.title = `${post.title} · 奇点社区`;

  // post.body 多段渲染（按 \n\n 分段）
  const bodyHtml = post.body
    ? post.body.split(/\n\n+/).map(p => `<p>${QDC.escape(p.trim()).replace(/\n/g, '<br>')}</p>`).join('')
    : `<p>${QDC.escape(post.excerpt || '')}</p>`;

  // 视频渲染：type=video 时优先用 videoEmbedType/Url; 兼容老种子帖的 thumb 占位
  let videoHtml = '';
  if (post.type === 'video') {
    if (post.videoEmbedType === 'youtube' || post.videoEmbedType === 'bilibili') {
      videoHtml = `<div class="pd-video"><iframe src="${post.videoEmbedUrl}" allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="no-referrer"></iframe></div>`;
    } else if (post.videoEmbedType === 'mp4' && post.videoEmbedUrl) {
      videoHtml = `<div class="pd-video"><video src="${post.videoEmbedUrl}" controls playsinline></video></div>`;
    } else if (post.videoUrl) {
      // 用户帖子但 embed 字段缺失时,运行时再嗅探一次
      const info = QDC.parseVideoUrl(post.videoUrl);
      if (info.type === 'youtube' || info.type === 'bilibili') {
        videoHtml = `<div class="pd-video"><iframe src="${info.embedUrl}" allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="no-referrer"></iframe></div>`;
      } else if (info.type === 'mp4') {
        videoHtml = `<div class="pd-video"><video src="${info.embedUrl}" controls playsinline></video></div>`;
      }
    }
  }

  // 图片渲染分两种风格:
  //   gallery 类型: 全宽堆叠 (每张 100% 宽)
  //   其他类型 (text 偶有图): grid 网格
  const images = Array.isArray(post.images) ? post.images.filter(u => typeof u === 'string') : [];
  const imagesHtml = images.length
    ? (post.type === 'gallery'
        ? `<div class="pd-gallery">${images.map(u => `<img src="${u.replace(/"/g, '&quot;')}" loading="lazy" alt="">`).join('')}</div>`
        : `<div class="pd-images">${images.map(u => `<img src="${u.replace(/"/g, '&quot;')}" loading="lazy" alt="">`).join('')}</div>`)
    : '';

  const isQuestion = post.type === 'question';
  const titlePrefix = isQuestion ? '❓ ' : '';
  const questionDetailHead = isQuestion
    ? `<div class="pd-question-head"><i class="ti ti-help-circle"></i> 问题详情</div>`
    : '';
  const emptyAnswers = isQuestion && !post.stats.comments
    ? `<div class="pd-empty-answers">
         <i class="ti ti-message-circle-question" style="font-size:32px;display:block;margin-bottom:8px;color:#FFD700"></i>
         <div>暂无回答,来留下你的见解</div>
       </div>`
    : '';

  const channelLink = QDC.channelPageUrl(ch && ch.id);
  const authorLink  = `profile.html?uid=${author.id}`;

  document.getElementById('postMain').innerHTML = `
    <div class="row gap-2 t-sm c-3" style="margin-bottom:12px">
      <a href="home.html" class="text-link"><i class="ti ti-arrow-left"></i> 返回</a>
      <span class="dot-sep"></span>
      <a href="${channelLink}" style="display:inline-flex">${QDC.tplChannelPill(ch)}</a>
      <span>${QD.fmtTime(post.createdAt) || post.createdAtText || ''}</span>
    </div>

    <article class="pd-post ${isQuestion ? 'is-question' : ''}">
      <div class="row gap-3">
        <a href="${authorLink}" style="display:inline-flex">${QDC.tplAvatar(author, 'lg')}</a>
        <div class="grow">
          <div class="row gap-2">
            <a href="${authorLink}" class="f-medium" style="color:inherit">${author.name}</a>
            <span class="badge">Lv.${author.level}</span>
            ${author.vip ? '<span class="badge gold">VIP</span>' : ''}
            ${isQuestion ? '<span class="badge" style="background:rgba(245,158,11,0.15);color:#FFD700;border:1px solid rgba(245,158,11,0.40)">❓ 待回答</span>' : ''}
          </div>
          <div class="t-sm c-3">${QD.fmtTime(post.createdAt) || post.createdAtText || ''} · 阅读 ${QD.fmtNum(post.stats.view)}</div>
        </div>
        <button class="btn sm"><i class="ti ti-user-plus"></i>关注</button>
      </div>

      <h1 class="pd-title">${titlePrefix}${post.title}</h1>

      ${videoHtml}
      ${questionDetailHead}

      <div class="pd-content">
        ${bodyHtml}
        ${imagesHtml}
      </div>

      ${emptyAnswers}

      <div class="pd-actions">
        <span class="pd-act active"><i class="ti ti-arrow-big-up"></i>${QD.fmtNum(post.stats.up)}</span>
        <span class="pd-act"><i class="ti ti-arrow-big-down"></i>反对</span>
        <span class="pd-act"><i class="ti ti-message-circle"></i>${post.stats.comments} 评论</span>
        <span class="pd-act"><i class="ti ti-share-3"></i>${post.stats.share} 分享</span>
        <span class="pd-act"><i class="ti ti-bookmark"></i>收藏</span>
        <span class="pd-act"><i class="ti ti-coin" style="color:#FFD700"></i>打赏</span>
        <span style="margin-left:auto"></span>
        <span class="pd-act"><i class="ti ti-dots"></i></span>
      </div>
    </article>

    <div class="comment-input">
      ${QDC.tplAvatar({ name: QD.user.username, avatar: QD.user.avatar, vip: true }, 'md')}
      <textarea placeholder="发表你的看法... ⌘+↵ 发送"></textarea>
      <button class="btn btn-primary" style="align-self:flex-end">发送</button>
    </div>

    <div class="card" style="padding: 20px 24px">
      <div class="row-between" style="margin-bottom: 14px">
        <h3 class="t-md f-medium" style="margin:0">${postComments.length} 条评论</h3>
        <div class="seg">
          <div class="seg-item active">最热</div>
          <div class="seg-item">最新</div>
        </div>
      </div>
      <div>
        ${postComments.length
          ? postComments.map(c => QDC.tplComment(c)).join('')
          : `<div style="padding: 32px 0; text-align: center; color: var(--text-3)">
               <i class="ti ti-message-circle" style="font-size: 32px; display: block; margin-bottom: 8px; color: var(--text-4)"></i>
               <div>暂无评论，做第一个发言的人</div>
             </div>`
        }
      </div>
    </div>
  `;

  // 实时房在线数：用 post.stats.liveOnline 替代写死的 142
  const liveCount = document.querySelector('.live-room-head .c-3');
  if (liveCount) liveCount.innerHTML = `<i class="ti ti-users"></i> ${post.stats.liveOnline} 在线`;

  QDC.startLiveRoom(document.querySelector('.live-room'), post.id);
})();
</script>
</body>
</html>
