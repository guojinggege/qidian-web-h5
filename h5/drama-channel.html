<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>短剧 · 奇点社区</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .h5-shell { padding-bottom: 80px; }
  .dr-banner-h5 {
    margin: 12px 16px 14px;
    padding: 22px;
    background:
      radial-gradient(circle at 80% 30%, rgba(229,90,75,0.30), transparent 50%),
      linear-gradient(135deg, var(--c-amber-bg), var(--c-coral-bg));
    border: 1px solid var(--border-2);
    border-radius: var(--r-xl);
  }
  .dr-banner-h5 h1 { font-size: 22px; font-weight: 500; margin: 8px 0 6px; }
  .dr-banner-h5 p { color: var(--text-2); font-size: 12px; margin: 0 0 12px; }

  .dr-tabs { display: flex; gap: 6px; padding: 0 16px 12px; overflow-x: auto; scrollbar-width: none; }
  .dr-tabs::-webkit-scrollbar { display: none; }
  .dr-tabs .h5-channel-tab { flex-shrink: 0; }

  .dr-section { padding: 12px 16px 0; }
  .dr-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .dr-section-head h3 { font-size: 14px; font-weight: 500; margin: 0; display: flex; align-items: center; gap: 6px; }

  .dr-row-watching {
    display: flex;
    gap: 10px;
    padding-bottom: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    margin-bottom: 20px;
  }
  .dr-row-watching::-webkit-scrollbar { display: none; }
  .dr-watching-card { flex-shrink: 0; width: 140px; }
  .dr-watching-card .drama-cover { aspect-ratio: 16/10; }

  .dr-grid-h5 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
</style>
</head>
<body>
<div class="h5-shell">
  <header class="h5-header">
    <i class="ti ti-arrow-left c-2" style="font-size:20px" onclick="history.back()"></i>
    <div class="title">短剧</div>
    <i class="ti ti-search c-2" style="font-size:20px"></i>
  </header>

  <div class="dr-banner-h5">
    <span class="ch-pill amber"><i class="ti ti-device-tv ico"></i>短剧</span>
    <h1>600+ 部海外华人爽剧</h1>
    <p>霸总 · 复仇 · 穿越 · 黑卡全部解锁</p>
    <div class="row gap-2">
      <button class="btn btn-vip"><i class="ti ti-crown"></i>VIP 全部解锁</button>
      <button class="btn">查看免费区</button>
    </div>
  </div>

  <div class="dr-tabs">
    <div class="h5-channel-tab active">全部</div>
    <div class="h5-channel-tab">霸总</div>
    <div class="h5-channel-tab">复仇</div>
    <div class="h5-channel-tab">穿越</div>
    <div class="h5-channel-tab">虐恋</div>
    <div class="h5-channel-tab">玄学</div>
    <div class="h5-channel-tab">职场</div>
  </div>

  <div class="dr-section">
    <div class="dr-section-head">
      <h3><i class="ti ti-history" style="color:var(--brand-300)"></i> 正在追</h3>
      <span class="text-link t-sm">查看全部 →</span>
    </div>
    <div class="dr-row-watching" id="watching"></div>
  </div>

  <div class="dr-section">
    <div class="dr-section-head">
      <h3><i class="ti ti-flame" style="color:var(--c-coral)"></i> 本周热推</h3>
    </div>
    <div class="dr-grid-h5" id="hotGrid"></div>
  </div>

  <div class="dr-section">
    <div class="dr-section-head"><h3>全部短剧</h3></div>
    <div class="dr-grid-h5" id="allGrid"></div>
  </div>

  <div class="h5-tabbar" id="tabbar"></div>
</div>

<script src="../shared/data.js?v=17"></script>
<script src="../shared/components.js?v=17"></script>
<script>
(async () => {
  await QD.ready();

  function dramaCardH5(d) {
    return `
      <a class="drama-card" href="drama-watch.html?id=${d.id}">
        <div class="drama-cover" style="background-image:${d.cover}">
          <div class="vip-lock"><i class="ti ti-crown"></i></div>
          <div class="episodes">${d.episodes}集</div>
        </div>
        <div class="drama-info">
          <div class="drama-title line-clamp-2">${d.title}</div>
          <div class="drama-meta">${d.plays} · ★${d.rating}</div>
        </div>
      </a>
    `;
  }

  function watchingCard(d, progress) {
    return `
      <a class="drama-card dr-watching-card" href="drama-watch.html?id=${d.id}">
        <div class="drama-cover" style="background-image:${d.cover}">
          <div class="episodes">已看 ${progress}/${d.episodes}</div>
          <div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(0,0,0,0.3)">
            <div style="height:100%;background:var(--brand-400);width:${progress/d.episodes*100}%"></div>
          </div>
        </div>
        <div class="drama-info">
          <div class="drama-title line-clamp-2">${d.title}</div>
          <div class="drama-meta">下一集 第 ${progress+1} 集</div>
        </div>
      </a>
    `;
  }

  document.getElementById('watching').innerHTML = QD.dramas.slice(0, 4).map((d, i) => watchingCard(d, [38, 12, 22, 5][i])).join('');
  document.getElementById('hotGrid').innerHTML = QD.dramas.slice(0, 4).map(dramaCardH5).join('');
  document.getElementById('allGrid').innerHTML = [...QD.dramas, ...QD.dramas].map(dramaCardH5).join('');

  QDC.renderH5TabBar(document.getElementById('tabbar'), 'channels');
})();
</script>
</body>
</html>
