<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>玄学命理 · 奇点社区</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  body { background: radial-gradient(ellipse at top, rgba(74,219,204,0.08), transparent 60%), var(--bg-base); }
  .h5-shell { padding-bottom: 80px; }

  .xy-banner-h5 {
    margin: 12px 16px 16px;
    padding: 22px;
    background:
      radial-gradient(circle at 90% 30%, rgba(74,219,204,0.30), transparent 50%),
      radial-gradient(circle at 10% 80%, rgba(159,127,229,0.20), transparent 50%),
      linear-gradient(135deg, rgba(35,35,48,0.95), rgba(26,26,34,0.95));
    border: 1px solid var(--border-2);
    border-radius: var(--r-xl);
    position: relative;
    overflow: hidden;
  }
  .xy-banner-h5::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.4), transparent), radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.4), transparent);
  }
  .xy-banner-h5 > * { position: relative; }
  .xy-banner-h5 h1 { font-size: 22px; font-weight: 500; margin: 8px 0 6px; }
  .xy-banner-h5 p { color: var(--text-2); font-size: 12px; margin: 0; line-height: 1.6; }

  .svc-grid-h5 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 16px; margin-bottom: 24px; }
  .svc-tile {
    padding: 14px 6px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
    text-align: center;
  }
  .svc-tile i { font-size: 22px; color: var(--c-teal); display: block; margin-bottom: 4px; }
  .svc-tile .name { font-size: 11px; }
  .svc-tile .price { font-size: 10px; color: #FFD700; margin-top: 2px; }

  .masters-section { padding: 0 16px; }
  .masters-section h3 { font-size: 14px; font-weight: 500; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }

  .master-list-h5 { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .master-h5 {
    display: flex; gap: 14px;
    padding: 14px;
    background: linear-gradient(180deg, rgba(74,219,204,0.05), var(--bg-card) 50%);
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
  }
  .master-avatar-h5 {
    width: 60px; height: 60px;
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--c-teal);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 20px; font-weight: 500;
    flex-shrink: 0;
  }

  /* Sheet */
  .scrim-h5 {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 80;
    display: none;
    align-items: flex-end; justify-content: center;
  }
  .scrim-h5.open { display: flex; }
  .sheet-h5 {
    width: 100%; max-width: 480px;
    background: var(--bg-card);
    border-top-left-radius: var(--r-xl);
    border-top-right-radius: var(--r-xl);
    padding: 20px;
    max-height: 80vh;
    overflow-y: auto;
    animation: sheet-up 0.25s ease-out;
  }
</style>
</head>
<body>
<div class="h5-shell">
  <header class="h5-header">
    <i class="ti ti-arrow-left c-2" style="font-size:20px" onclick="history.back()"></i>
    <div class="title">玄学命理</div>
    <i class="ti ti-search c-2" style="font-size:20px"></i>
  </header>

  <div class="xy-banner-h5">
    <span class="ch-pill teal"><i class="ti ti-yin-yang ico"></i>玄学</span>
    <h1>问己之所惑，问命之所归</h1>
    <p>4 位认证大师 · 平均回复 6 小时内</p>
  </div>

  <div class="svc-grid-h5">
    <div class="svc-tile"><i class="ti ti-yin-yang"></i><div class="name">八字精批</div><div class="price">¥99 起</div></div>
    <div class="svc-tile"><i class="ti ti-zodiac-cancer"></i><div class="name">紫微斗数</div><div class="price">¥199 起</div></div>
    <div class="svc-tile"><i class="ti ti-home"></i><div class="name">风水堪舆</div><div class="price">¥599 起</div></div>
    <div class="svc-tile"><i class="ti ti-cards"></i><div class="name">塔罗占卜</div><div class="price">¥39 起</div></div>
  </div>

  <div class="masters-section">
    <h3><i class="ti ti-stars" style="color:#FFD700"></i> 认证大师</h3>
    <div class="master-list-h5" id="masterList"></div>
  </div>

  <div class="masters-section">
    <h3>近期案例</h3>
    <div id="feed" style="display:flex;flex-direction:column;gap:0"></div>
  </div>

  <div class="h5-tabbar" id="tabbar"></div>
</div>

<!-- Sheet: Reservation -->
<div class="scrim-h5" id="scrim" onclick="if(event.target.id==='scrim')this.classList.remove('open')">
  <div class="sheet-h5">
    <div class="row-between" style="margin-bottom:14px">
      <div class="t-md f-medium">预约咨询</div>
      <i class="ti ti-x c-3" style="font-size:20px" onclick="document.getElementById('scrim').classList.remove('open')"></i>
    </div>

    <div class="row gap-3" style="padding:12px;background:var(--bg-elev);border-radius:var(--r-md);margin-bottom:16px">
      <div class="avatar lg bg-grad-7 has-bg">玄</div>
      <div>
        <div class="f-medium">玄海道长</div>
        <div class="t-sm c-3">紫微斗数 · ★4.98 · 12,842 单</div>
      </div>
    </div>

    <div class="col gap-3">
      <div class="field">
        <span class="field-label">服务类型</span>
        <div class="row gap-2" style="flex-wrap:wrap">
          <span class="badge brand">紫微全盘 ¥299</span>
          <span class="badge">单问题 ¥99</span>
          <span class="badge">流年运程 ¥499</span>
        </div>
      </div>
      <div class="field">
        <span class="field-label">出生信息</span>
        <input class="input" placeholder="阳历 1992-08-15 12:30 / 男">
      </div>
      <div class="field">
        <span class="field-label">困惑陈述</span>
        <textarea class="textarea" placeholder="最近想换工作但是几个offer都犹豫..." style="min-height: 80px"></textarea>
      </div>
      <div class="field row-between" style="padding: 4px 0">
        <span class="t-sm c-3">实付（黑卡 8 折）</span>
        <span class="t-xl f-medium" style="color:#FFD700">¥239</span>
      </div>
      <button class="btn btn-primary block lg">立即支付</button>
    </div>
  </div>
</div>

<script src="../shared/data.js?v=9"></script>
<script src="../shared/components.js?v=9"></script>
<script>
(async () => {
  await QD.ready();

  document.getElementById('masterList').innerHTML = QD.masters.map(m => `
    <div class="master-h5" onclick="document.getElementById('scrim').classList.add('open')">
      <div class="master-avatar-h5 ${m.avatar}">${m.name.slice(0,1)}</div>
      <div class="grow">
        <div class="row gap-2">
          <span class="f-medium">${m.name}</span>
          <span class="badge t-xs">★ ${m.rating}</span>
          <span class="badge brand t-xs">${m.badge}</span>
        </div>
        <div class="t-sm c-3" style="margin: 4px 0">${m.title}</div>
        <div class="row gap-2">
          ${m.tags.map(t => `<span class="t-xs c-3">#${t}</span>`).join('')}
        </div>
      </div>
      <div style="text-align:right">
        <div class="t-md f-medium" style="color:#FFD700;font-family:ui-monospace,monospace">¥${m.price}</div>
        <div class="t-xs c-4">起/次</div>
      </div>
    </div>
  `).join('');

  const f = QD.posts.filter(p => p.channelId === 'fortune');
  document.getElementById('feed').innerHTML = (f.length ? f : QD.posts.slice(0,2)).map(p => QDC.tplPostCard(p).replace('<article ', `<article onclick="location.href='post-detail.html?id=${p.id}'" `)).join('');

  QDC.renderH5TabBar(document.getElementById('tabbar'), 'channels');
})();
</script>
</body>
</html>
